services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: mailercloud-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  flink-jobmanager:
    image: flink:1.18.1-java17
    container_name: mailercloud-flink-jobmanager
    restart: unless-stopped
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        state.backend: hashmap
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
        execution.checkpointing.interval: 5000
        execution.checkpointing.mode: EXACTLY_ONCE
        restart-strategy.type: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 2 s
    volumes:
      - ./task/docker/flink-lib:/opt/flink/usrlib
      - ./task/flink-checkpoints:/tmp/flink-checkpoints
      - ./task/docker/flink-jobs:/opt/flink/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka

  flink-taskmanager:
    image: flink:1.18.1-java17
    container_name: mailercloud-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: hashmap
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
        execution.checkpointing.interval: 5000
        execution.checkpointing.mode: EXACTLY_ONCE
    volumes:
      - ./task/docker/flink-lib:/opt/flink/usrlib
      - ./task/flink-checkpoints:/tmp/flink-checkpoints
      - ./task/docker/flink-jobs:/opt/flink/jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - flink-jobmanager
